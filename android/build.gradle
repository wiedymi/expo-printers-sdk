plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.printers'
version = '0.10.0'

android {
  namespace "expo.modules.printers"
  defaultConfig {
    versionCode 1
    versionName "0.10.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
    implementation files('libs/ePOS2.jar')
    implementation files('libs/rongta_library.jar')

    implementation 'com.starmicronics:stario:2.14.2'
    implementation 'com.starmicronics:starioextension:1.17.0'

    implementation 'androidx.core:core-ktx:1.18.0'
}
